[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-assistant"
version = "0.2.0"
description = "Evidence-grounded resume analysis with explicit human approval gates."
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.15",
  "langgraph-checkpoint-postgres==3.2.0",
  "pydantic==2.14.1",
  "groq==1.7.0",
  "cryptography==50.0.2",
  "pydantic-settings==2.16.0",
  "psycopg[binary]==3.3.6",
  "fastapi==0.143.1",
  "uvicorn==0.54.0",
  "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]
security = ["pip-audit==2.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
